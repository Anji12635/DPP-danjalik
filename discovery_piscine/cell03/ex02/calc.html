
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's Over 9000!</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <div class="calculator">
        <h1>Basic Calculator</h1>

        <form id="calcForm">
            <input type="text" id="left" placeholder="First number">

            <select id="operator">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
                <option value="%">%</option>
            </select>

            <input type="text" id="right" placeholder="Second number">

            <input type="submit" value="Try me!">
        </form>
    </div>

    <script src="calc.js"></script>
</body>
</html>
