
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="profile-card">

        <header class="card-header">
            <h2>MY PROFILE</h2>
        </header>

        <div class="profile-content">

            <img src="profile.jpg"
                 alt="My Profile Picture"
                 class="profile-picture">

            <h1>@danjalik</h1>

            <p class="description">Robotics & AI Student</p>

            <table class="info-table">
                <tr>
                    <td>Department</td>
                    <td>Robotics & AI</td>
                </tr>
                <tr>
                    <td>University</td>
                    <td>KMITL</td>
                </tr>
                <tr>
                    <td>Interests</td>
                    <td>Coding & Technology</td>
                </tr>
            </table>

            <div class="social-icons">

                <a href="https://www.instagram.com/YOUR_USERNAME/"
                   target="_blank" rel="noopener noreferrer">
                    <img src="https://cdn.simpleicons.org/instagram/E4405F"
                         alt="Instagram">
                </a>

                <a href="https://www.tiktok.com/@YOUR_USERNAME"
                   target="_blank" rel="noopener noreferrer">
                    <img src="https://cdn.simpleicons.org/tiktok/000000"
                         alt="TikTok">
                </a>

                <a href="https://www.facebook.com/YOUR_USERNAME"
                   target="_blank" rel="noopener noreferrer">
                    <img src="https://cdn.simpleicons.org/facebook/1877F2"
                         alt="Facebook">
                </a>

            </div>

            <a href="mailto:YOUR_EMAIL@example.com"
               class="contact-button">
                Contact
            </a>

        </div>

    </div>

</body>
</html>
