<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Responsive</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        td {
            width: 50%;
            height: 100%;
            text-align: center;
            vertical-align: middle;
            overflow-wrap: break-word;
            font-size: clamp(14px, 3vw, 32px);
        }

        .culpa {
            background-color: pink;
        }

        .autumn {
            background-color: orange;
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <td class="culpa">Culpa Mia</td>
            <td class="autumn">Autumn in my heart</td>
        </tr>
    </table>
</body>
</html>
